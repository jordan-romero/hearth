name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed issues are caught even without a push.
    - cron: "0 6 * * 1"

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secret scanning: catch committed API keys, DB passwords, tokens ─────────
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for a complete scan
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code=1

  # ── SAST: static analysis for insecure code patterns (free CodeQL stand-in) ──
  sast:
    name: static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Run semgrep
        # Code-security SAST rulesets. Supply-chain / CI-config hardening is done
        # deliberately in config (pnpm build-trust, Dependabot cooldown, etc.)
        # rather than gated by p/default's noisy package-manager rules.
        run: semgrep scan --config=p/security-audit --config=p/typescript --config=p/javascript --error

  # ── Dependency audit: fail on known-vulnerable packages ─────────────────────
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production deps (fail on high/critical)
        # Only shipping deps gate the build; dev-tool advisories (e.g. the
        # vite/vitest dev server) are tracked by Dependabot but never reach prod.
        run: pnpm audit --prod --audit-level=high
